<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>گردونه شانس علی فرد</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at top, #123c31 0%, #071b16 45%, #020806 100%);

    color: #fff;

    font-family: Tahoma, Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 22px;

    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    width: 320px;
    height: 320px;

    background: rgba(35, 105, 83, .15);

    border-radius: 50%;

    filter: blur(80px);

    top: -120px;
    right: -100px;

    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;
    width: 280px;
    height: 280px;

    background: rgba(255,255,255,.04);

    border-radius: 50%;

    filter: blur(70px);

    bottom: -100px;
    left: -80px;

    pointer-events: none;
}

.container {
    width: 100%;
    max-width: 520px;

    text-align: center;

    position: relative;
    z-index: 2;
}

/* عنوان */

h1 {
    margin: 0;

    font-size: 30px;
    font-weight: 800;

    letter-spacing: -1px;

    color: #ffffff;

    text-shadow:
        0 3px 15px rgba(0,0,0,.7);
}

.subtitle {
    margin-top: 10px;
    margin-bottom: 28px;

    color: #c9ddd7;

    font-size: 15px;
}

/* قاب گردونه */

.wheel-box {
    position: relative;

    width: min(88vw, 420px);
    height: min(88vw, 420px);

    margin: auto;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* هاله پشت گردونه */

.wheel-box::before {
    content: "";

    position: absolute;

    width: 94%;
    height: 94%;

    border-radius: 50%;

    background: #000;

    box-shadow:
        0 0 50px rgba(0,0,0,.9),
        0 0 80px rgba(15,75,59,.35);

    z-index: -1;
}

/* گردونه */

#wheel {
    width: 100%;
    height: 100%;

    border-radius: 50%;

    border: 7px solid #ffffff;

    box-shadow:
        0 0 0 4px #0b2b22,
        0 0 0 8px #020605,
        0 15px 40px rgba(0,0,0,.8);

    background: #071b16;

    transition:
        transform 4s cubic-bezier(.12,.7,.18,1);
}

/* فلش */

.pointer {
    position: absolute;

    top: -14px;
    left: 50%;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 19px solid transparent;
    border-right: 19px solid transparent;

    border-top: 45px solid #ffffff;

    z-index: 20;

    filter:
        drop-shadow(0 3px 2px #000)
        drop-shadow(0 0 8px rgba(255,255,255,.25));
}

/* دکمه */

button {
    margin-top: 38px;

    width: 90%;
    max-width: 350px;

    padding: 17px 20px;

    border: 2px solid #ffffff;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #dce9e5 100%
        );

    color: #071b16;

    font-size: 19px;
    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 8px 0 #020605,
        0 12px 30px rgba(0,0,0,.45);

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        background .2s ease;
}

button:hover {
    background: #ffffff;

    transform: translateY(-2px);

    box-shadow:
        0 10px 0 #020605,
        0 16px 35px rgba(0,0,0,.55);
}

button:active {
    transform: translateY(6px);

    box-shadow:
        0 2px 0 #020605,
        0 7px 18px rgba(0,0,0,.4);
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

/* نتیجه */

.result {
    display: none;

    margin: 28px auto 0;

    width: 90%;
    max-width: 400px;

    padding: 20px 18px;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(0,0,0,.25)
        );

    border: 1px solid rgba(255,255,255,.25);

    box-shadow:
        0 15px 40px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.08);

    backdrop-filter: blur(10px);
}

.result-title {
    color: #c9ddd7;

    font-size: 16px;

    margin-bottom: 5px;
}

.prize {
    margin-top: 8px;

    color: #ffffff;

    font-size: 24px;
    font-weight: 900;

    text-shadow:
        0 3px 12px rgba(0,0,0,.7);
}

/* موبایل */

@media (max-width: 430px) {

    body {
        padding: 18px;
    }

    h1 {
        font-size: 25px;
    }

    .subtitle {
        font-size: 14px;
        margin-bottom: 24px;
    }

    .pointer {
        border-left-width: 16px;
        border-right-width: 16px;
        border-top-width: 39px;
    }

    button {
        font-size: 18px;
        padding: 16px;
    }

    .prize {
        font-size: 21px;
    }
}

</style>
</head>

<body>

<div class="container">

    <h1>🎁 گردونه شانس علی فرد</h1>

    <div class="subtitle">
        گردونه رو بچرخون و جایزه‌ات رو ببر!
    </div>

    <div class="wheel-box">

        <div class="pointer"></div>

        <canvas
            id="wheel"
            width="500"
            height="500">
        </canvas>

    </div>

    <button id="spinButton">
        چرخاندن گردونه 🎡
    </button>

    <div class="result" id="result">

        <div class="result-title">
            🎉 جایزه شما
        </div>

        <div class="prize" id="prize"></div>

    </div>

</div>

<script>

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const button = document.getElementById("spinButton");
const result = document.getElementById("result");
const prizeText = document.getElementById("prize");

/* =========================
   جوایز
========================= */

const prizes = [
    "ماسک مو رایگان",
    "۵۰٪ تخفیف پاکسازی",
    "شمع گوش رایگان",
    "شمع رایگان",
    "قهوه رایگان",
    "۳۰٪ تخفیف تیشرت",
    "با خرید ۲ تیشرت\n۱ تیشرت رایگان",
    "تخلیه چربی بینی رایگان"
];

/* =========================
   رنگ‌های گردونه
========================= */

const colors = [
    "#0b3329",
    "#123f32",
    "#071b16",
    "#15503f",
    "#0a2921",
    "#184b3c",
    "#06150f",
    "#1b5945"
];

let currentRotation = 0;
let isSpinning = false;

/* =========================
   شکستن متن
========================= */

function wrapText(text, maxLength) {

    if (text.includes("\n")) {
        return text.split("\n");
    }

    const words = text.split(" ");

    const lines = [];

    let line = "";

    words.forEach(word => {

        const testLine =
            line ? line + " " + word : word;

        if (testLine.length > maxLength) {

            if (line) {
                lines.push(line);
            }

            line = word;

        } else {

            line = testLine;

        }

    });

    if (line) {
        lines.push(line);
    }

    return lines;
}

/* =========================
   رسم گردونه
========================= */

function drawWheel() {

    const center = 250;
    const radius = 240;

    const slice =
        (Math.PI * 2) / prizes.length;

    ctx.clearRect(0, 0, 500, 500);

    for (let i = 0; i < prizes.length; i++) {

        const start = i * slice;
        const end = start + slice;

        /* بخش */

        ctx.beginPath();

        ctx.moveTo(center, center);

        ctx.arc(
            center,
            center,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle = colors[i];

        ctx.fill();

        /* خطوط جداکننده */

        ctx.strokeStyle = "#020806";

        ctx.lineWidth = 6;

        ctx.stroke();

        /* متن */

        ctx.save();

        ctx.translate(center, center);

        ctx.rotate(
            start + slice / 2
        );

        ctx.fillStyle = "#ffffff";

        ctx.font =
            "bold 16px Tahoma";

        ctx.textAlign = "right";
        ctx.textBaseline = "middle";

        ctx.shadowColor =
            "rgba(0,0,0,.8)";

        ctx.shadowBlur = 5;

        const lines =
            wrapText(prizes[i], 15);

        const lineHeight = 22;

        const startY =
            -((lines.length - 1) * lineHeight) / 2;

        lines.forEach((line, index) => {

            ctx.fillText(
                line,
                radius - 18,
                startY + index * lineHeight
            );

        });

        ctx.restore();
    }

    /* مرکز گردونه */

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        50,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#020806";

    ctx.fill();

    ctx.strokeStyle = "#ffffff";

    ctx.lineWidth = 4;

    ctx.stroke();

    ctx.fillStyle = "#ffffff";

    ctx.font =
        "bold 18px Tahoma";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "علی فرد",
        center,
        center
    );
}

/* =========================
   چرخش
========================= */

function spin() {

    if (isSpinning) {
        return;
    }

    isSpinning = true;

    button.disabled = true;

    result.style.display = "none";

    /* انتخاب جایزه */

    const winner =
        Math.floor(
            Math.random() * prizes.length
        );

    const slice =
        360 / prizes.length;

    const winnerCenter =
        winner * slice + slice / 2;

    /*
       فلش در زاویه -90
    */

    const targetRotation =
        -90 - winnerCenter;

    let delta =
        targetRotation -
        (currentRotation % 360);

    if (delta < 0) {
        delta += 360;
    }

    /* شش دور کامل */

    const extraSpins =
        360 * 6;

    const finalRotation =
        currentRotation +
        extraSpins +
        delta;

    currentRotation =
        finalRotation;

    canvas.style.transform =
        "rotate(" +
        finalRotation +
        "deg)";

    /* نتیجه */

    setTimeout(function() {

        prizeText.textContent =
            prizes[winner].replace("\n", " ");

        result.style.display =
            "block";

        isSpinning = false;

        button.disabled = false;

    }, 4200);
}

/* =========================
   اجرا
========================= */

button.addEventListener(
    "click",
    spin
);

drawWheel();

</script>

</body>
</html>
