<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>گردونه شانس علی فرد</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Tahoma, Arial, sans-serif;
    background: #07140f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 520px;
    text-align: center;
}

h1 {
    margin: 5px 0 8px;
    font-size: 28px;
}

.subtitle {
    color: #b9c8c1;
    margin-bottom: 20px;
    font-size: 14px;
}

.wheel-area {
    position: relative;
    width: min(90vw, 440px);
    aspect-ratio: 1;
    margin: auto;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,.35));
}

.pointer {
    position: absolute;
    top: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 42px solid #ffffff;
    z-index: 5;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.5));
}

.center-dot {
    position: absolute;
    width: 62px;
    height: 62px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #0d241b;
    border: 5px solid #fff;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
}

button {
    border: none;
    background: #fff;
    color: #07140f;
    font-size: 18px;
    font-weight: bold;
    padding: 14px 38px;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 22px;
    transition: .2s;
}

button:hover {
    transform: scale(1.03);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}

.result {
    display: none;
    margin-top: 25px;
    padding: 22px;
    border-radius: 18px;
    background: #10271f;
    border: 1px solid #29493d;
}

.result.show {
    display: block;
    animation: appear .4s ease;
}

.result-title {
    font-size: 17px;
    color: #b9c8c1;
    margin-bottom: 12px;
}

.prize-name {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.details {
    line-height: 2;
    font-size: 15px;
}

.old-price {
    text-decoration: line-through;
    color: #9da9a4;
}

.final-price {
    font-size: 18px;
    font-weight: bold;
    color: #fff;
}

.note {
    margin-top: 14px;
    font-size: 12px;
    color: #9eaea7;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 400px) {
    h1 {
        font-size: 24px;
    }

    .prize-name {
        font-size: 19px;
    }

    .center-dot {
        width: 52px;
        height: 52px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🎡 گردونه شانس علی فرد</h1>
    <div class="subtitle">
        شانس خودتو امتحان کن و جایزه‌ات رو ببر!
    </div>

    <div class="wheel-area">
        <div class="pointer"></div>
        <canvas id="wheel" width="900" height="900"></canvas>
        <div class="center-dot">ALi<br>Fard</div>
    </div>

    <button id="spinBtn">چرخوندن گردونه 🎡</button>

    <div class="result" id="result">
        <div class="result-title">🎉 جایزه شما</div>

        <div class="prize-name" id="prizeName"></div>

        <div class="details" id="details"></div>

        <div class="note">
            برای استفاده از جایزه، هنگام مراجعه این صفحه را نشان دهید.
        </div>
    </div>

</div>

<script>

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const spinBtn = document.getElementById("spinBtn");
const resultBox = document.getElementById("result");
const prizeName = document.getElementById("prizeName");
const details = document.getElementById("details");

const prizes = [

    {
        name: "کد تخفیف ۶۰۰ هزار تومنی پاکسازی",
        detail: `
            پاکسازی: <span class="old-price">۱,۲۰۰,۰۰۰ تومان</span><br>
            <b>۶۰۰,۰۰۰ تومان تخفیف</b><br>
            قیمت با تخفیف: <span class="final-price">۶۰۰,۰۰۰ تومان</span>
        `
    },

    {
        name: "کد تخفیف ۵۰۰ هزار تومنی ماساژ",
        detail: `
            ماساژ نیم‌ساعته: <span class="old-price">۱,۰۰۰,۰۰۰ تومان</span><br>
            <b>۵۰۰,۰۰۰ تومان تخفیف</b><br>
            قیمت با تخفیف: <span class="final-price">۵۰۰,۰۰۰ تومان</span>
        `
    },

    {
        name: "کد تخفیف ۳۰۰ هزار تومنی خرید تیشرت",
        detail: `
            <b>۳۰۰,۰۰۰ تومان تخفیف</b><br>
            ویژه خرید تیشرت
        `
    },

    {
        name: "ماسک مو رایگان",
        detail: `
            ارزش واقعی: <span class="old-price">۱۰۰,۰۰۰ تومان</span><br>
            قیمت برای شما: <span class="final-price">رایگان 🎁</span>
        `
    },

    {
        name: "شمع گوش رایگان",
        detail: `
            ارزش واقعی: <span class="old-price">۱۰۰,۰۰۰ تومان</span><br>
            قیمت برای شما: <span class="final-price">رایگان 🎁</span>
        `
    },

    {
        name: "قهوه رایگان",
        detail: `
            ارزش واقعی: <span class="old-price">۱۰۰,۰۰۰ تومان</span><br>
            قیمت برای شما: <span class="final-price">رایگان ☕</span>
        `
    },

    {
        name: "با خرید ۲ تیشرت، ۱ تیشرت رایگان",
        detail: `
            با خرید ۲ تیشرت<br>
            <span class="final-price">۱ تیشرت رایگان 🎁</span>
        `
    },

    {
        name: "شانس دوباره 🍀",
        detail: `
            <span class="final-price">یک بار دیگه گردونه رو بچرخون!</span>
        `
    },

    {
        name: "قهوه رایگان",
        detail: `
            ارزش واقعی: <span class="old-price">۱۰۰,۰۰۰ تومان</span><br>
            قیمت برای شما: <span class="final-price">رایگان ☕</span>
        `
    },

    {
        name: "شانس دوباره 🍀",
        detail: `
            <span class="final-price">یک بار دیگه گردونه رو بچرخون!</span>
        `
    }

];

const colors = [
    "#174936",
    "#0d2f24",
    "#245c48",
    "#123b2d",
    "#2d7057",
    "#0b251c",
    "#1c503d",
    "#316e58",
    "#143a2c",
    "#397c61"
];

let rotation = 0;
let spinning = false;

const slice = (Math.PI * 2) / prizes.length;


/* =========================
   DRAW WHEEL
========================= */

function drawWheel() {

    const size = canvas.width;
    const center = size / 2;
    const radius = size / 2 - 12;

    ctx.clearRect(0, 0, size, size);

    for (let i = 0; i < prizes.length; i++) {

        const start = -Math.PI / 2 + i * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, start, end);
        ctx.closePath();

        ctx.fillStyle = colors[i];
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 5;
        ctx.stroke();

        // متن داخل گردونه
        ctx.save();

        ctx.translate(center, center);
        ctx.rotate(start + slice / 2);

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 25px Tahoma";

        let text = prizes[i].name;

        // کوتاه کردن متن برای نمایش روی گردونه
        if (text.includes("کد تخفیف ۶۰۰")) {
            text = "۶۰۰ هزار تومان\nپاکسازی";
        }
        else if (text.includes("کد تخفیف ۵۰۰")) {
            text = "۵۰۰ هزار تومان\nماساژ";
        }
        else if (text.includes("کد تخفیف ۳۰۰")) {
            text = "۳۰۰ هزار تومان\nتیشرت";
        }
        else if (text.includes("ماسک مو")) {
            text = "ماسک مو\nرایگان";
        }
        else if (text.includes("شمع گوش")) {
            text = "شمع گوش\nرایگان";
        }
        else if (text.includes("قهوه")) {
            text = "قهوه\nرایگان";
        }
        else if (text.includes("۲ تیشرت")) {
            text = "۲ تیشرت بخر\n۱ تیشرت رایگان";
        }
        else {
            text = "شانس\nدوباره 🍀";
        }

        const lines = text.split("\n");

        // متن را کمی به سمت بیرون می‌بریم
        const textRadius = radius * 0.67;

        for (let j = 0; j < lines.length; j++) {
            ctx.fillText(
                lines[j],
                textRadius,
                (j - (lines.length - 1) / 2) * 32
            );
        }

        ctx.restore();
    }

    // حلقه بیرونی
    ctx.beginPath();
    ctx.arc(center, center, radius, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 10;
    ctx.stroke();
}

drawWheel();


/* =========================
   SPIN
========================= */

function spin() {

    if (spinning) return;

    spinning = true;
    spinBtn.disabled = true;
    resultBox.classList.remove("show");

    // انتخاب تصادفی جایزه
    const selectedIndex =
        Math.floor(Math.random() * prizes.length);

    /*
       زاویه‌ای که باید گردونه بچرخد تا
       مرکز خانه انتخاب‌شده دقیقاً زیر فلش قرار بگیرد.
    */

    const targetAngle =
        -(selectedIndex * slice + slice / 2);

    const currentNormalized =
        rotation % (Math.PI * 2);

    let difference =
        targetAngle - currentNormalized;

    while (difference < 0) {
        difference += Math.PI * 2;
    }

    // حداقل 6 دور کامل
    const extraSpins = 6 * Math.PI * 2;

    const finalRotation =
        rotation + extraSpins + difference;

    const startRotation = rotation;
    const duration = 5000;
    const startTime = performance.now();

    function animate(now) {

        const elapsed = now - startTime;
        const progress =
            Math.min(elapsed / duration, 1);

        // easing
        const ease =
            1 - Math.pow(1 - progress, 4);

        rotation =
            startRotation +
            (finalRotation - startRotation) * ease;

        canvas.style.transform =
            `rotate(${rotation}rad)`;

        if (progress < 1) {

            requestAnimationFrame(animate);

        } else {

            rotation = finalRotation;

            showPrize(selectedIndex);

            spinning = false;
            spinBtn.disabled = false;
        }
    }

    requestAnimationFrame(animate);
}


/* =========================
   SHOW RESULT
========================= */

function showPrize(index) {

    const prize = prizes[index];

    prizeName.textContent = prize.name;
    details.innerHTML = prize.detail;

    resultBox.classList.add("show");

    resultBox.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });
}


spinBtn.addEventListener("click", spin);

</script>

</body>
</html>
