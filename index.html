<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>گردونه شانس علی فرد</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Tahoma, Arial, sans-serif;
    background: #07140f;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 520px;
    text-align: center;
}

h1 {
    margin: 5px 0 8px;
    font-size: 28px;
}

.subtitle {
    color: #b9c8c1;
    margin-bottom: 20px;
    font-size: 14px;
}

/* CODE */

#codeScreen {
    background: #10271f;
    border: 1px solid #29493d;
    border-radius: 20px;
    padding: 28px 20px;
    margin: 25px auto;
    max-width: 420px;
}

#codeScreen h2 {
    margin-top: 0;
    font-size: 21px;
}

#codeInput {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #416456;
    background: #07140f;
    color: white;
    text-align: center;
    font-size: 18px;
    outline: none;
    margin: 15px 0 10px;
    text-transform: uppercase;
}

#codeInput:focus {
    border-color: white;
}

#errorMessage {
    display: none;
    color: #ff8d8d;
    font-size: 13px;
    margin-top: 10px;
}

/* WHEEL */

#wheelScreen {
    display: none;
}

.wheel-area {
    position: relative;
    width: min(90vw, 440px);
    aspect-ratio: 1;
    margin: auto;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,.35));
}

.pointer {
    position: absolute;
    top: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 42px solid #fff;
    z-index: 5;
}

.center-dot {
    position: absolute;
    width: 62px;
    height: 62px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #0d241b;
    border: 5px solid #fff;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
}

button {
    border: none;
    background: #fff;
    color: #07140f;
    font-size: 18px;
    font-weight: bold;
    padding: 14px 38px;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 22px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* RESULT */

.result {
    display: none;
    margin-top: 25px;
    padding: 22px;
    border-radius: 18px;
    background: #10271f;
    border: 1px solid #29493d;
}

.result.show {
    display: block;
}

.result-title {
    font-size: 17px;
    color: #b9c8c1;
    margin-bottom: 12px;
}

.prize-name {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.details {
    line-height: 2;
    font-size: 15px;
}

.old-price {
    text-decoration: line-through;
    color: #9da9a4;
}

.final-price {
    font-size: 18px;
    font-weight: bold;
}

.note {
    margin-top: 14px;
    font-size: 12px;
    color: #9eaea7;
}

.payment-note {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #07140f;
    border: 1px solid #416456;
    line-height: 1.8;
}

</style>
</head>

<body>

<div class="container">

<h1>🎡 گردونه شانس علی فرد</h1>

<div class="subtitle">
شانست رو امتحان کن و جایزه‌ات رو ببر!
</div>


<!-- CODE SCREEN -->

<div id="codeScreen">

<h2>🔐 کد شانس امروزت رو وارد کن</h2>

<div>
کدی که از علی فرد دریافت کردی وارد کن
</div>

<input
id="codeInput"
type="text"
placeholder="کد شانس"
autocomplete="off"
>

<button id="enterBtn">
ورود به گردونه 🎁
</button>

<div id="errorMessage">
❌ کد وارد شده صحیح نیست.
</div>

</div>


<!-- WHEEL -->

<div id="wheelScreen">

<div class="wheel-area">

<div class="pointer"></div>

<canvas
id="wheel"
width="900"
height="900">
</canvas>

<div class="center-dot">
ALi<br>Fard
</div>

</div>

<button id="spinBtn">
چرخوندن گردونه 🎡
</button>


<div class="result" id="result">

<div class="result-title">
🎉 نتیجه گردونه
</div>

<div
class="prize-name"
id="prizeName">
</div>

<div
class="details"
id="details">
</div>

<div
class="payment-note"
id="paymentNote"
style="display:none;">
</div>

<div class="note">
برای استفاده از جایزه، هنگام مراجعه این صفحه را نشان دهید.
</div>

</div>

</div>

</div>


<script>

/* =========================
   ACCESS CODE
========================= */

const ACCESS_CODE = "ALIFARD";


/* =========================
   PRIZES
========================= */

const prizes = [

{
name: "کد تخفیف ۶۰۰ هزار تومنی پاکسازی",

detail: `
پاکسازی:
<span class="old-price">۱,۲۰۰,۰۰۰ تومان</span>
<br>
<b>۶۰۰,۰۰۰ تومان تخفیف</b>
<br>
قیمت با تخفیف:
<span class="final-price">۶۰۰,۰۰۰ تومان</span>
`
},

{
name: "کد تخفیف ۵۰۰ هزار تومنی ماساژ",

detail: `
ماساژ نیم‌ساعته:
<span class="old-price">۱,۰۰۰,۰۰۰ تومان</span>
<br>
<b>۵۰۰,۰۰۰ تومان تخفیف</b>
<br>
قیمت با تخفیف:
<span class="final-price">۵۰۰,۰۰۰ تومان</span>
`
},

{
name: "کد تخفیف ۳۰۰ هزار تومنی خرید تیشرت",

detail: `
<b>۳۰۰,۰۰۰ تومان تخفیف</b>
<br>
ویژه خرید تیشرت
`
},

{
name: "ماسک مو رایگان",

detail: `
ارزش واقعی:
<span class="old-price">۱۰۰,۰۰۰ تومان</span>
<br>
قیمت برای شما:
<span class="final-price">رایگان 🎁</span>
`
},

{
name: "شمع گوش رایگان",

detail: `
ارزش واقعی:
<span class="old-price">۱۰۰,۰۰۰ تومان</span>
<br>
قیمت برای شما:
<span class="final-price">رایگان 🎁</span>
`
},

{
name: "قهوه رایگان",

detail: `
ارزش واقعی:
<span class="old-price">۱۰۰,۰۰۰ تومان</span>
<br>
قیمت برای شما:
<span class="final-price">رایگان ☕</span>
`
},

{
name: "با خرید ۲ تیشرت، ۱ تیشرت رایگان",

detail: `
با خرید ۲ تیشرت
<br>
<span class="final-price">
۱ تیشرت رایگان 🎁
</span>
`
},

{
name: "شانس دوباره 🍀",

detail: `
<span class="final-price">
یک بار دیگه گردونه رو بچرخون!
</span>
`,

extraChance: true
},

{
name: "قهوه رایگان",

detail: `
ارزش واقعی:
<span class="old-price">۱۰۰,۰۰۰ تومان</span>
<br>
قیمت برای شما:
<span class="final-price">رایگان ☕</span>
`
},

{
name: "پوچ 😶",

detail: `
<span class="final-price">
این بار چیزی نصیبت نشد 😅
</span>
<br>
دفعه بعد شانست رو امتحان کن!
`
}

];


/* =========================
   ELEMENTS
========================= */

const codeInput =
document.getElementById("codeInput");

const enterBtn =
document.getElementById("enterBtn");

const errorMessage =
document.getElementById("errorMessage");

const codeScreen =
document.getElementById("codeScreen");

const wheelScreen =
document.getElementById("wheelScreen");

const canvas =
document.getElementById("wheel");

const ctx =
canvas.getContext("2d");

const spinBtn =
document.getElementById("spinBtn");

const result =
document.getElementById("result");

const prizeName =
document.getElementById("prizeName");

const details =
document.getElementById("details");

const paymentNote =
document.getElementById("paymentNote");


/* =========================
   LOGIN
========================= */

function checkCode() {

const code =
codeInput.value.trim().toUpperCase();

if(code === ACCESS_CODE) {

errorMessage.style.display = "none";

codeScreen.style.display = "none";

wheelScreen.style.display = "block";

updateButton();

}

else {

errorMessage.style.display = "block";

codeInput.value = "";

codeInput.focus();

}

}

enterBtn.addEventListener(
"click",
checkCode
);

codeInput.addEventListener(
"keydown",
function(e) {

if(e.key === "Enter") {
checkCode();
}

}
);


/* =========================
   STATE
========================= */

let state = {

firstSpinUsed: false,

extraChanceAvailable: false,

extraChanceUsed: false

};

const STORAGE_KEY =
"ali_fard_wheel_state";


try {

const saved =
localStorage.getItem(STORAGE_KEY);

if(saved) {

state =
JSON.parse(saved);

}

} catch(e) {}


function saveState() {

try {

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(state)
);

} catch(e) {}

}


/* =========================
   BUTTON
========================= */

function updateButton() {

if(!state.firstSpinUsed) {

spinBtn.disabled = false;

spinBtn.textContent =
"چرخوندن گردونه 🎡";

}

else if(
state.extraChanceAvailable &&
!state.extraChanceUsed
) {

spinBtn.disabled = false;

spinBtn.textContent =
"استفاده از شانس دوباره 🍀";

}

else {

spinBtn.disabled = false;

spinBtn.textContent =
"چرخش مجدد — ۵۰,۰۰۰ تومان";

}

}


/* =========================
   WHEEL DRAW
========================= */

const colors = [

"#174936",
"#0d2f24",
"#245c48",
"#123b2d",
"#2d7057",
"#0b251c",
"#1c503d",
"#316e58",
"#143a2c",
"#397c61"

];

const slice =
(Math.PI * 2) / prizes.length;

let rotation = 0;

let spinning = false;


function drawWheel() {

const center =
canvas.width / 2;

const radius =
canvas.width / 2 - 12;

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


for(
let i = 0;
i < prizes.length;
i++
) {

const start =
-Math.PI / 2 + i * slice;

const end =
start + slice;


ctx.beginPath();

ctx.moveTo(
center,
center
);

ctx.arc(
center,
center,
radius,
start,
end
);

ctx.closePath();

ctx.fillStyle =
colors[i];

ctx.fill();

ctx.strokeStyle =
"#ffffff";

ctx.lineWidth = 5;

ctx.stroke();


ctx.save();

ctx.translate(
center,
center
);

ctx.rotate(
start + slice / 2
);

ctx.textAlign =
"center";

ctx.textBaseline =
"middle";

ctx.fillStyle =
"#ffffff";

ctx.font =
"bold 24px Tahoma";


let text;


if(prizes[i].name.includes("۶۰۰")) {

text =
"۶۰۰ هزار تومان\nپاکسازی";

}

else if(prizes[i].name.includes("۵۰۰")) {

text =
"۵۰۰ هزار تومان\nماساژ";

}

else if(prizes[i].name.includes("۳۰۰")) {

text =
"۳۰۰ هزار تومان\nتیشرت";

}

else if(prizes[i].name.includes("ماسک")) {

text =
"ماسک مو\nرایگان";

}

else if(prizes[i].name.includes("شمع")) {

text =
"شمع گوش\nرایگان";

}

else if(
prizes[i].name.includes("۲ تیشرت")
) {

text =
"۲ تیشرت بخر\n۱ تیشرت رایگان";

}

else if(
prizes[i].name.includes("قهوه")
) {

text =
"قهوه\nرایگان";

}

else if(
prizes[i].name.includes("پوچ")
) {

text =
"پوچ 😶";

}

else {

text =
"شانس\nدوباره 🍀";

}


const lines =
text.split("\n");

const textRadius =
radius * .67;


for(
let j = 0;
j < lines.length;
j++
) {

ctx.fillText(

lines[j],

textRadius,

(
j -
(lines.length - 1) / 2
) * 32

);

}

ctx.restore();

}


/* BORDER */

ctx.beginPath();

ctx.arc(
center,
center,
radius,
0,
Math.PI * 2
);

ctx.strokeStyle =
"#ffffff";

ctx.lineWidth = 10;

ctx.stroke();

}

drawWheel();


/* =========================
   SPIN
========================= */

function spin() {

/*
اگر شانس رایگان تمام شده
فقط پیام پرداخت نشان داده شود.
*/

if(
state.firstSpinUsed &&
(!state.extraChanceAvailable ||
state.extraChanceUsed)
) {

showPayment();

return;

}


if(spinning)
return;


spinning = true;

spinBtn.disabled = true;

result.classList.remove("show");


const selectedIndex =
Math.floor(
Math.random() * prizes.length
);


const targetAngle =
-(
selectedIndex * slice +
slice / 2
);


const current =
rotation %
(Math.PI * 2);


let difference =
targetAngle - current;


while(difference < 0) {

difference +=
Math.PI * 2;

}


const extraSpins =
6 * Math.PI * 2;


const finalRotation =
rotation +
extraSpins +
difference;


const startRotation =
rotation;

const duration =
5000;

const startTime =
performance.now();


function animate(now) {

const elapsed =
now - startTime;

const progress =
Math.min(
elapsed / duration,
1
);

const ease =
1 - Math.pow(
1 - progress,
4
);


rotation =
startRotation +
(
finalRotation -
startRotation
) *
ease;


canvas.style.transform =
`rotate(${rotation}rad)`;


if(progress < 1) {

requestAnimationFrame(
animate
);

}

else {

rotation =
finalRotation;

finishSpin(
selectedIndex
);

spinning = false;

}

}

requestAnimationFrame(
animate
);

}


/* =========================
   FINISH
========================= */

function finishSpin(index) {

const prize =
prizes[index];


/*
اولین چرخش
*/

if(!state.firstSpinUsed) {

state.firstSpinUsed = true;

}


/*
اگر در چرخش دوم هستیم،
شانس دوباره مصرف می‌شود.
*/

else if(
state.extraChanceAvailable &&
!state.extraChanceUsed
) {

state.extraChanceUsed = true;

state.extraChanceAvailable = false;

}


/*
اگر روی شانس دوباره افتاد
و هنوز قبلاً استفاده نشده،
یک چرخش اضافه فعال می‌شود.
*/

if(
prize.extraChance &&
!state.extraChanceUsed
) {

state.extraChanceAvailable = true;

}


saveState();

showPrize(prize);

updateButton();

}


/* =========================
   RESULT
========================= */

function showPrize(prize) {

prizeName.textContent =
prize.name;

details.innerHTML =
prize.detail;

paymentNote.style.display =
"none";

result.classList.add("show");

result.scrollIntoView({
behavior: "smooth",
block: "nearest"
});

}


/* =========================
   PAYMENT
========================= */

function showPayment() {

prizeName.textContent =
"🎡 شانس رایگان شما تمام شده";

details.innerHTML =
"برای چرخاندن دوباره گردونه، مبلغ <b>۵۰,۰۰۰ تومان</b> پرداخت کنید.";

paymentNote.innerHTML =
"💰 هزینه چرخش مجدد: <b>۵۰,۰۰۰ تومان</b>";

paymentNote.style.display =
"block";

result.classList.add("show");

result.scrollIntoView({
behavior: "smooth",
block: "nearest"
});

}


spinBtn.addEventListener(
"click",
spin
);

</script>

</body>
</html>
