<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>گردونه شانس علی فرد</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #071b16;
    color: white;
    font-family: Tahoma, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 520px;
    text-align: center;
}

h1 {
    margin: 0 0 8px;
    font-size: 29px;
}

.subtitle {
    color: #b9d4cb;
    margin-bottom: 25px;
}

.wheel-box {
    position: relative;
    width: min(88vw, 420px);
    height: min(88vw, 420px);
    margin: auto;
}

#wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow:
        0 0 0 8px #d5b46a,
        0 0 30px rgba(0,0,0,.7);

    transition: transform 4s cubic-bezier(.12,.7,.18,1);
}

.pointer {
    position: absolute;
    top: -17px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;

    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 42px solid white;

    z-index: 10;
    filter: drop-shadow(0 3px 4px #000);
}

button {
    margin-top: 35px;
    width: 90%;
    max-width: 350px;
    padding: 17px;

    border: none;
    border-radius: 14px;

    background: #d5b46a;
    color: #071b16;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;
    box-shadow: 0 7px 0 #9d8145;
}

button:active {
    transform: translateY(5px);
    box-shadow: 0 2px 0 #9d8145;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.result {
    display: none;
    margin-top: 25px;
    padding: 20px;

    border: 1px solid #d5b46a;
    border-radius: 15px;

    background: rgba(255,255,255,.06);
}

.result-title {
    color: #d5b46a;
    font-size: 18px;
}

.prize {
    margin-top: 8px;
    font-size: 24px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <h1>🎁 گردونه شانس علی فرد</h1>

    <div class="subtitle">
        گردونه رو بچرخون و جایزه‌ات رو ببر!
    </div>

    <div class="wheel-box">

        <div class="pointer"></div>

        <canvas id="wheel" width="500" height="500"></canvas>

    </div>

    <button id="spinButton">
        چرخاندن گردونه 🎡
    </button>

    <div class="result" id="result">

        <div class="result-title">
            🎉 جایزه شما:
        </div>

        <div class="prize" id="prize"></div>

    </div>

</div>

<script>

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const button = document.getElementById("spinButton");
const result = document.getElementById("result");
const prizeText = document.getElementById("prize");

/* =========================
   جوایز
========================= */

const prizes = [
    "ماسک مو رایگان",
    "۵۰٪ تخفیف پاکسازی",
    "شمع گوش رایگان",
    "شمع رایگان",
    "قهوه رایگان",
    "۳۰٪ تخفیف تیشرت",
    "با خرید ۲ تیشرت\n۱ تیشرت رایگان",
    "تخلیه چربی بینی رایگان"
];

/* =========================
   رنگ‌ها
========================= */

const colors = [
    "#123d32",
    "#d5b46a",
    "#0d2c24",
    "#b99750",
    "#184d3e",
    "#8f753f",
    "#0b352b",
    "#c3a55d"
];

let currentRotation = 0;
let isSpinning = false;

/* =========================
   تبدیل متن به چند خط
========================= */

function wrapText(text, maxLength) {

    if (text.includes("\n")) {
        return text.split("\n");
    }

    const words = text.split(" ");
    const lines = [];
    let line = "";

    words.forEach(word => {

        const testLine =
            line ? line + " " + word : word;

        if (testLine.length > maxLength) {

            if (line) {
                lines.push(line);
            }

            line = word;

        } else {

            line = testLine;

        }
    });

    if (line) {
        lines.push(line);
    }

    return lines;
}

/* =========================
   رسم گردونه
========================= */

function drawWheel() {

    const center = 250;
    const radius = 240;

    const slice =
        (Math.PI * 2) / prizes.length;

    ctx.clearRect(0, 0, 500, 500);

    for (let i = 0; i < prizes.length; i++) {

        const start = i * slice;
        const end = start + slice;

        /* بخش گردونه */

        ctx.beginPath();

        ctx.moveTo(center, center);

        ctx.arc(
            center,
            center,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle = colors[i];
        ctx.fill();

        ctx.strokeStyle = "#071b16";
        ctx.lineWidth = 5;
        ctx.stroke();

        /* =====================
           متن جایزه
        ===================== */

        ctx.save();

        ctx.translate(center, center);

        const middleAngle =
            start + slice / 2;

        ctx.rotate(middleAngle);

        ctx.fillStyle = "#ffffff";

        ctx.font =
            "bold 16px Tahoma";

        ctx.textAlign = "right";
        ctx.textBaseline = "middle";

        const lines =
            wrapText(prizes[i], 15);

        const lineHeight = 22;

        const startY =
            -((lines.length - 1) * lineHeight) / 2;

        lines.forEach((line, index) => {

            ctx.fillText(
                line,
                radius - 18,
                startY + index * lineHeight
            );

        });

        ctx.restore();
    }

    /* =====================
       دایره وسط
    ===================== */

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        48,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#071b16";
    ctx.fill();

    ctx.strokeStyle = "#d5b46a";
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.fillStyle = "#d5b46a";

    ctx.font =
        "bold 18px Tahoma";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "علی فرد",
        center,
        center
    );
}

/* =========================
   چرخاندن گردونه
========================= */

function spin() {

    if (isSpinning) {
        return;
    }

    isSpinning = true;
    button.disabled = true;

    result.style.display = "none";

    /* انتخاب تصادفی */

    const winner =
        Math.floor(
            Math.random() * prizes.length
        );

    const slice =
        360 / prizes.length;

    /*
       مرکز قسمت برنده
    */

    const winnerCenter =
        winner * slice + slice / 2;

    /*
       فلش بالای گردونه است
       یعنی زاویه -90 درجه
    */

    const targetRotation =
        -90 - winnerCenter;

    let delta =
        targetRotation -
        (currentRotation % 360);

    if (delta < 0) {
        delta += 360;
    }

    /* ۶ دور کامل */

    const extraSpins =
        360 * 6;

    const finalRotation =
        currentRotation +
        extraSpins +
        delta;

    currentRotation =
        finalRotation;

    canvas.style.transform =
        "rotate(" +
        finalRotation +
        "deg)";

    /* نمایش نتیجه */

    setTimeout(function() {

        prizeText.textContent =
            prizes[winner].replace("\n", " ");

        result.style.display =
            "block";

        isSpinning = false;
        button.disabled = false;

    }, 4200);
}

/* =========================
   شروع
========================= */

button.addEventListener(
    "click",
    spin
);

drawWheel();

</script>

</body>
</html>
