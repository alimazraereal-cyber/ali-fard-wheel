<script>
const missions=[
["اولین تجربه","اولین اصلاح خودت را در مجموعه علی فرد تجربه کن."],
["قرار بعدی","نوبت بعدی خودت را رزرو کن و مسیرت را ادامه بده."],
["سرِ نوبتت حاضر باش","سر وقت در نوبت رزروشده حاضر شو."],
["یک تجربه متفاوت","یکی از خدمات ویژه علی فرد را تجربه کن."],
["همراه علی فرد","صفحه علی فرد را در شبکه‌های اجتماعی دنبال کن."],
["آخرین قدم","آخرین مرحله را کامل کن تا انتخاب جایزه برایت باز شود."]
];

const key="ali_fard_white_card",rkey="ali_fard_white_reward";
let completed=Number(localStorage.getItem(key))||0;
let selected=localStorage.getItem(rkey)||null;

function pn(n){
 return String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
}

function render(){
 const box=document.getElementById("missions");

 box.innerHTML=missions.map((m,i)=>{
   const n=i+1;
   const done=n<=completed;
   const active=n===completed+1;

   return `
   <div class="mission ${done?"completed":active?"active":"locked"}">
     <div class="mission-head">
       <div class="mission-icon">${n===6?"★":"0"+n}</div>
       <div class="mission-info">
         <div class="mission-kicker">MISSION ${n}</div>
         <div class="mission-title">${m[0]}</div>
         <div class="mission-description">${m[1]}</div>
       </div>
     </div>

     <button
       class="mission-button"
       ${active?`onclick="completeMission(${n})"`:"disabled"}>
       ${done?"تکمیل شد ✓":active?"انجام شد ✓":"قفل است 🔒"}
     </button>
   </div>`;
 }).join("");

 document.getElementById("progressText").textContent=
   pn(completed)+" از ۶";

 document.getElementById("progressFill").style.width=
   (completed/6*100)+"%";

 for(let i=1;i<=6;i++){
   const step=document.getElementById("step"+i);

   step.classList.remove("active","completed");

   if(i<=completed)
     step.classList.add("completed");
   else if(i===completed+1)
     step.classList.add("active");
 }

 if(completed===6)
   document.getElementById("reward").classList.add("show");
}

function completeMission(n){

 if(n!==completed+1)return;

 completed=n;

 localStorage.setItem(key,completed);

 render();

 if(completed===6){
   setTimeout(()=>{
     document.getElementById("reward")
       .scrollIntoView({
         behavior:"smooth",
         block:"center"
       });
   },200);
 }
}

function selectReward(el){

 document.querySelectorAll(".reward-option")
   .forEach(x=>x.classList.remove("selected"));

 el.classList.add("selected");

 selected=el.dataset.reward;

 document.getElementById("chooseButton")
   .classList.add("show");
}

function confirmReward(){

 if(!selected)return;

 localStorage.setItem(rkey,selected);

 document.getElementById("selectedRewardName")
   .textContent=selected;

 document.getElementById("selectedReward")
   .classList.add("show");

 document.getElementById("chooseButton")
   .style.display="none";

 document.querySelectorAll(".reward-option")
   .forEach(x=>x.style.pointerEvents="none");
}

function resetCard(){

 localStorage.removeItem(key);
 localStorage.removeItem(rkey);

 location.reload();
}

render();

if(selected){
 document.getElementById("selectedRewardName")
   .textContent=selected;

 document.getElementById("selectedReward")
   .classList.add("show");

 document.getElementById("chooseButton")
   .style.display="none";
}
</script>
